<script>
(() => {
  const stage=document.getElementById('stage'), knob=document.getElementById('knob'), stext=document.getElementById('stext');
  let start=null;
  const maxX=()=>stage.clientWidth*(972-268)/1179;
  async function wake(){try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch(e){}}
  document.addEventListener('pointerdown',wake,{once:true});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') wake();});

  // 着信前：真っ暗。どこかをタップすると点灯して着信画面に
  document.body.classList.add('off');
  stage.addEventListener('pointerdown',()=>{document.body.classList.remove('off');});
  // 「あとで通知」をタップすると着信前に戻る（撮り直し用）
  document.getElementById('alarm').addEventListener('pointerdown',e=>{
    e.stopPropagation(); if(!document.body.classList.contains('off')) document.body.classList.add('off'); else document.body.classList.remove('off');
  });

  knob.addEventListener('pointerdown',e=>{start=e.clientX;knob.classList.remove('back');knob.setPointerCapture(e.pointerId);});
  knob.addEventListener('pointermove',e=>{
    if(start===null) return;
    const dx=Math.max(0,Math.min(maxX(),e.clientX-start));
    knob.style.transform=`translateX(${dx}px)`;
    stext.style.opacity=Math.max(0,1-dx/(maxX()*0.5));
  });
  const end=()=>{if(start===null) return;start=null;knob.classList.add('back');knob.style.transform='translateX(0)';stext.style.opacity=1;};
  knob.addEventListener('pointerup',end); knob.addEventListener('pointercancel',end);
})();
</script>
